# This file is the deployment source of truth. The release workflow updates only image.tag.
image:
  repository: ggalva/otel-flask-app
  tag: "6f07d9771957c598a3a133f2eae3b4cec82e08ad"

service:
  type: ClusterIP

ingress:
  enabled: true
  className: kong
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/https-redirect-status-code: "301"
  hosts:
    - host: app.putturu.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-putturu-in-tls
      hosts:
        - app.putturu.in

app:
  environment: development

collector:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      # The kube-prometheus-stack Argo CD application uses Helm release name "monitoring".
      labels:
        release: monitoring
  dynatrace:
    enabled: true
    # Replace with your Dynatrace environment OTLP ingest endpoint.
    otlpEndpoint: "https://fwe60734.live.dynatrace.com/api/v2/otlp"
    secretName: dynatrace-otel
    tokenKey: api-token

externalSecrets:
  enabled: true
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  keyVaultSecretName: dynatrace-otel-token
  targetSecretName: dynatrace-otel
  targetSecretKey: api-token
