# This file is the deployment source of truth. The release workflow updates only image.tag.
image:
  repository: ggalva/otel-flask-app
  tag: "f77ea197d79308249d88b137b2f765c666f5c513"

service:
  type: LoadBalancer

app:
  environment: development

collector:
  dynatrace:
    enabled: true
    # Replace with your Dynatrace environment OTLP ingest endpoint.
    otlpEndpoint: "https://fwe60734.live.dynatrace.com/api/v2/otlp"
    secretName: dynatrace-otel
    tokenKey: api-token

externalSecrets:
  enabled: true
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  keyVaultSecretName: dynatrace-otel-token
  targetSecretName: dynatrace-otel
  targetSecretKey: api-token
