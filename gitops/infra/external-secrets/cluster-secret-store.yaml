# Replace the three Azure placeholders before applying this file.
# This object is cluster-scoped and intentionally resides outside the app Helm release.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://obs-proj.vault.azure.net
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
      environmentType: PublicCloud
