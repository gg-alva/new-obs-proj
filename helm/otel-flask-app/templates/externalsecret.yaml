{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "otel-flask-app.fullname" . }}-dynatrace
  labels:
    {{- include "otel-flask-app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.targetSecretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.keyVaultSecretName }}
{{- end }}
