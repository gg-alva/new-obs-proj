{{- if and .Values.collector.enabled .Values.collector.prometheus.enabled .Values.collector.prometheus.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "otel-flask-app.fullname" . }}-collector
  labels:
    {{- include "otel-flask-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
    {{- with .Values.collector.prometheus.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "otel-flask-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.collector.prometheus.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.collector.prometheus.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
