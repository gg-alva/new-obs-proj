{{- if .Values.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-flask-app.fullname" . }}-collector
  labels:
    {{- include "otel-flask-app.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
      batch: {}
    exporters:
      {{- if .Values.collector.dynatrace.enabled }}
      otlphttp/dynatrace:
        endpoint: ${env:DYNATRACE_OTLP_ENDPOINT}
        headers:
          Authorization: "Bearer ${env:DYNATRACE_API_TOKEN}"
      {{- else }}
      debug:
        verbosity: basic
      {{- end }}
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ if .Values.collector.dynatrace.enabled }}otlphttp/dynatrace{{ else }}debug{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ if .Values.collector.dynatrace.enabled }}otlphttp/dynatrace{{ else }}debug{{ end }}]
{{- end }}
