{{- if .Values.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-flask-app.fullname" . }}-collector
  labels:
    {{- include "otel-flask-app.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
      batch: {}
    exporters:
      {{- if .Values.collector.prometheus.enabled }}
      prometheus:
        endpoint: 0.0.0.0:{{ .Values.collector.prometheus.port }}
        resource_to_telemetry_conversion:
          enabled: true
      {{- end }}
      {{- if .Values.collector.dynatrace.enabled }}
      otlphttp/dynatrace:
        endpoint: ${env:DYNATRACE_OTLP_ENDPOINT}
        headers:
          Authorization: "Bearer ${env:DYNATRACE_API_TOKEN}"
      {{- end }}
      {{- if and (not .Values.collector.prometheus.enabled) (not .Values.collector.dynatrace.enabled) }}
      debug:
        verbosity: basic
      {{- end }}
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{ if .Values.collector.dynatrace.enabled }}otlphttp/dynatrace{{ else }}debug{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [{{- if .Values.collector.prometheus.enabled }}prometheus{{- end }}{{- if and .Values.collector.prometheus.enabled .Values.collector.dynatrace.enabled }}, {{- end }}{{- if .Values.collector.dynatrace.enabled }}otlphttp/dynatrace{{- end }}{{- if and (not .Values.collector.prometheus.enabled) (not .Values.collector.dynatrace.enabled) }}debug{{- end }}]
{{- end }}
