name: Release and promote development

on:
  push:
    branches: [main]
    paths-ignore:
      - "gitops/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: write

jobs:
  publish-and-promote:
    runs-on: ubuntu-latest
    # Required repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/otel-flask-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/otel-flask-app:latest
      - name: Update GitOps desired image version
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/otel-flask-app
        run: |
          sed -i "s|^  repository: .*|  repository: ${IMAGE_REPOSITORY}|" gitops/environments/dev/myapp-values.yaml
          sed -i "s|^  tag: .*|  tag: \"${IMAGE_TAG}\"|" gitops/environments/dev/myapp-values.yaml
      - name: Commit promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/dev/myapp-values.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): deploy ${GITHUB_SHA} to dev"
          git push
